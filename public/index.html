<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FIFA World Cup 2026 - Fan Assistant</title>
<style>
  :root {
    --primary: #0b5ed7;
    --accent: #ffb703;
    --bg: #0f1729;
    --card-bg: #ffffff;
    --text-dark: #1a1a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, var(--bg), #1c2b4a);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app-card {
    background: var(--card-bg);
    width: 100%;
    max-width: 480px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  header {
    background: var(--primary);
    color: white;
    padding: 20px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
  }
  header p {
    margin: 4px 0 0;
    font-size: 13px;
    opacity: 0.85;
  }
  .controls {
    padding: 12px 20px 0;
  }
  select {
    width: 100%;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
  }
  #chat-window {
    height: 340px;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 85%;
    font-size: 14px;
    line-height: 1.4;
  }
  .msg.user {
    background: var(--primary);
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 2px;
  }
  .msg.bot {
    background: #eef2f8;
    color: var(--text-dark);
    align-self: flex-start;
    border-bottom-left-radius: 2px;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    border-top: 1px solid #eee;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 14px;
  }
  button {
    background: var(--accent);
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>
</head>
<body>

  <main class="app-card">
    <header>
      <h1>🏟️ FIFA World Cup 2026 Fan Assistant</h1>
      <p>Ask about navigation, accessibility, transport & more</p>
    </header>

    <div class="controls">
      <label for="language" style="font-size:13px; color:#333;">Answer language:</label>
      <select id="language">
        <option value="English">English</option>
        <option value="Spanish">Spanish</option>
        <option value="French">French</option>
        <option value="Portuguese">Portuguese</option>
        <option value="Arabic">Arabic</option>
        <option value="Hindi">Hindi</option>
      </select>
    </div>

    <div id="chat-window" aria-live="polite">
      <div class="msg bot">Welcome! Ask me anything about the stadium — for example: "Where is the nearest accessible entrance?"</div>
    </div>

    <form id="chat-form">
      <input type="text" id="question" placeholder="Type your question..." autocomplete="off" required />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
